{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            IABuddy RBAC
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{% static 'frontend/css/style.css' %}">

</head>


<body>


    {% include "frontend/navbar.html" %}


    <main class="container-fluid py-4">

        <div class="container">

            <div class="mb-4">

                <h3 class="mb-0">

                    {% block page_title %}
                    {% endblock %}

                </h3>

            </div>


            {% block content %}
            {% endblock %}

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script
        src="{% static 'frontend/js/auth.js' %}">
    </script>

    <script
        src="{% static 'frontend/js/navbar.js' %}">
    </script>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
