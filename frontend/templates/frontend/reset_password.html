{% extends "frontend/base.html" %}

{% load static %}

{% block title %}
    Reset Password | IABuddy RBAC
{% endblock %}

{% block page_title %}
    Reset Password
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h4 class="mb-1">
                            Reset Password
                        </h4>

                        <p class="text-muted mb-0">
                            Enter your new password.
                        </p>

                    </div>


                    <div
                        id="reset-password-message"
                        class="alert d-none"
                        role="alert">
                    </div>


                    <form id="reset-password-form">

                        <div class="mb-3">

                            <label
                                for="new-password"
                                class="form-label">
                                New Password
                            </label>

                            <input
                                type="password"
                                id="new-password"
                                class="form-control"
                                minlength="8"
                                autocomplete="new-password"
                                required>

                        </div>


                        <div class="mb-3">

                            <label
                                for="confirm-password"
                                class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirm-password"
                                class="form-control"
                                minlength="8"
                                autocomplete="new-password"
                                required>

                        </div>


                        <div class="d-grid">

                            <button
                                type="submit"
                                id="reset-password-button"
                                class="btn btn-primary">

                                Reset Password

                            </button>

                        </div>

                    </form>


                    <div class="text-center mt-3">

                        <a href="/login/">
                            Back to Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script
    src="{% static 'frontend/js/reset_password.js' %}">
</script>

{% endblock %}
