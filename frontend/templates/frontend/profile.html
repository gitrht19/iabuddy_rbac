{% extends "frontend/base.html" %}

{% load static %}

{% block title %}
    My Profile | IABuddy RBAC
{% endblock %}

{% block page_title %}
    My Profile
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <div
                            class="mb-3">

                            <i
                                class="bi bi-person-circle"
                                style="font-size: 4rem;">
                            </i>

                        </div>

                        <h4 class="mb-1">
                            My Profile
                        </h4>

                        <p class="text-muted mb-0">
                            View and update your profile details.
                        </p>

                    </div>


                    <div
                        id="profile-loading"
                        class="text-center py-4">

                        <div
                            class="spinner-border"
                            role="status">

                            <span class="visually-hidden">
                                Loading...
                            </span>

                        </div>

                    </div>


                    <div
                        id="profile-error"
                        class="alert alert-danger d-none"
                        role="alert">
                    </div>


                    <div
                        id="profile-content"
                        class="d-none">

                        <div
                            id="profile-message"
                            class="alert d-none"
                            role="alert">
                        </div>


                        <form id="profile-form">

                            <div class="mb-3">

                                <label
                                    for="account-id"
                                    class="form-label">
                                    Account ID
                                </label>

                                <input
                                    type="text"
                                    id="account-id"
                                    class="form-control"
                                    readonly>

                            </div>


                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    readonly>

                            </div>


                            <div class="mb-3">

                                <label
                                    for="full-name"
                                    class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="full-name"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="d-grid">

                                <button
                                    type="submit"
                                    id="profile-save-button"
                                    class="btn btn-primary">

                                    Save Changes

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script
    src="{% static 'frontend/js/profile.js' %}">
</script>

{% endblock %}
