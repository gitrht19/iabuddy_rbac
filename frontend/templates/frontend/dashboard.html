{% extends "frontend/base.html" %}

{% load static %}

{% block title %}
    Dashboard | IABuddy RBAC
{% endblock %}

{% block page_title %}
    Dashboard
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div
        id="dashboard-loading"
        class="text-center py-5">

        <div
            class="spinner-border"
            role="status">

            <span class="visually-hidden">
                Loading...
            </span>

        </div>

        <p class="text-muted mt-2 mb-0">
            Loading dashboard...
        </p>

    </div>


    <div
        id="dashboard-content"
        class="d-none">

        <div class="row g-4">

            <div class="col-md-6 col-lg-4">

                <div class="card border-0 shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex align-items-center">

                            <div class="me-3">

                                <i class="bi bi-people fs-2"></i>

                            </div>

                            <div>

                                <h6 class="text-muted mb-1">
                                    Users
                                </h6>

                                <h4 class="mb-0">
                                    -
                                </h4>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-md-6 col-lg-4">

                <div class="card border-0 shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex align-items-center">

                            <div class="me-3">

                                <i class="bi bi-shield-check fs-2"></i>

                            </div>

                            <div>

                                <h6 class="text-muted mb-1">
                                    Roles
                                </h6>

                                <h4 class="mb-0">
                                    -
                                </h4>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-md-6 col-lg-4">

                <div class="card border-0 shadow-sm h-100">

                    <div class="card-body">

                        <div class="d-flex align-items-center">

                            <div class="me-3">

                                <i class="bi bi-key fs-2"></i>

                            </div>

                            <div>

                                <h6 class="text-muted mb-1">
                                    Permissions
                                </h6>

                                <h4 class="mb-0">
                                    -
                                </h4>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <div
        id="dashboard-error"
        class="alert alert-danger d-none mt-4"
        role="alert">
    </div>

</div>

{% endblock %}


{% block extra_js %}

<script src="{% static 'frontend/js/dashboard.js' %}"></script>

{% endblock %}
