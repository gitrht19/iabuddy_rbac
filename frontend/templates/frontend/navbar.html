{% load static %}

<div id="authenticated-navbar" class="d-none">

    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">

        <div class="container-fluid">

            <!-- Brand -->

            <a
                class="navbar-brand fw-semibold"
                href="/dashboard/">

                IABuddy RBAC

            </a>


            <!-- Mobile Toggle -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navbar Content -->

            <div
                class="collapse navbar-collapse"
                id="mainNavbar">

                <div class="ms-auto">

                    <!-- Profile Dropdown -->

                    <div class="dropdown">

                        <button
                            type="button"
                            id="navbar-profile-button"
                            class="btn btn-light d-flex align-items-center gap-2 border"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">

                            <i
                                class="bi bi-person-circle fs-5">
                            </i>


                            <span
                                id="navbar-user-name">
                            </span>


                            <i
                                class="bi bi-chevron-down small">
                            </i>

                        </button>


                        <!-- Profile Card -->

                        <div
                            class="dropdown-menu dropdown-menu-end shadow border-0 p-0"
                            style="min-width: 300px;">

                            <div class="p-3">

                                <!-- Profile Header -->

                                <div
                                    class="d-flex align-items-center mb-3">

                                    <i
                                        class="bi bi-person-circle me-3"
                                        style="font-size: 2.5rem;">
                                    </i>


                                    <div class="flex-grow-1">

                                        <div
                                            id="profile-card-name"
                                            class="fw-semibold">
                                        </div>


                                        <div
                                            id="profile-card-email"
                                            class="text-muted small">
                                        </div>

                                    </div>


                                    <!-- Edit Icon -->

                                    <button
                                        type="button"
                                        id="edit-profile-button"
                                        class="btn btn-sm btn-light"
                                        title="Edit Profile">

                                        <i
                                            class="bi bi-pencil">
                                        </i>

                                    </button>

                                </div>


                                <!-- View Mode -->

                                <div
                                    id="profile-view-mode">

                                    <div class="mb-3">

                                        <div
                                            class="text-muted small mb-1">

                                            Account ID

                                        </div>


                                        <div
                                            id="profile-card-account-id"
                                            class="small text-break">
                                        </div>

                                    </div>

                                </div>


                                <!-- Edit Mode -->

                                <div
                                    id="profile-edit-mode"
                                    class="d-none">

                                    <div class="mb-3">

                                        <label
                                            for="profile-full-name"
                                            class="form-label small text-muted">

                                            Full Name

                                        </label>


                                        <input
                                            type="text"
                                            id="profile-full-name"
                                            class="form-control form-control-sm"
                                            required>

                                    </div>


                                    <div
                                        class="d-flex gap-2">

                                        <button
                                            type="button"
                                            id="save-profile-button"
                                            class="btn btn-primary btn-sm flex-grow-1">

                                            Save

                                        </button>


                                        <button
                                            type="button"
                                            id="cancel-profile-button"
                                            class="btn btn-light btn-sm">

                                            Cancel

                                        </button>

                                    </div>

                                </div>


                                <!-- Logout -->

                                <div
                                    class="border-top pt-3 mt-3">

                                    <button
                                        type="button"
                                        id="logout-button"
                                        class="btn btn-outline-danger w-100">

                                        <i
                                            class="bi bi-box-arrow-right me-1">
                                        </i>

                                        Logout

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </nav>

</div>
